name: CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, such as v1.0.0
        required: true
        type: string
      targets:
        description: Space-separated archive labels to upload, such as "1.21.4 26.3". Leave empty to upload every archive.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      platform: curseforge
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      targets: ${{ inputs.targets }}
      project-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
    secrets:
      token: ${{ secrets.CURSEFORGE_TOKEN }}
