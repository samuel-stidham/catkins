name: GitHub release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach archives to, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Build archives
        id: build
        uses: ./.github/actions/build-release
        with:
          tag: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Attach archives and notes to the release, creating it when a tag has none
        shell: bash
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          mapfile -t archives < <(jq -r '"dist/" + .targets[].file' dist/manifest.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Setting the notes of release $TAG from CHANGELOG.md"
            gh release edit "$TAG" --notes-file dist/release-notes.md
            echo "Attaching ${#archives[@]} archives to release $TAG"
            gh release upload "$TAG" "${archives[@]}" --clobber
          else
            gh release create "$TAG" "${archives[@]}" \
              --verify-tag \
              --title "Catkins $VERSION" \
              --notes-file dist/release-notes.md
          fi

      - name: Verify every archive is attached
        shell: bash
        run: |
          jq -r '.targets[].file' dist/manifest.json | sort > dist/expected.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > dist/attached.txt
          missing="$(comm -23 dist/expected.txt dist/attached.txt)"
          if [[ -n "$missing" ]]; then
            echo "Release $TAG is missing these archives:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "All $(wc -l < dist/expected.txt) archives are attached to $TAG"
