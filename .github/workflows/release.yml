name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Check release configuration
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.0.0 or v1.0.0-beta.1" >&2
            exit 1
          fi
          for variable_name in MODRINTH_PROJECT_ID MODRINTH_TOKEN CURSEFORGE_PROJECT_ID CURSEFORGE_TOKEN; do
            if [[ -z "${!variable_name}" ]]; then
              echo "$variable_name is not configured" >&2
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=dist/catkins-java-$version.zip" >> "$GITHUB_ENV"

      - name: Install build dependency
        run: python -m pip install --requirement requirements.txt

      - name: Build Java pack
        run: python tools/build.py --version "$VERSION"

      - name: Generate release notes and platform metadata
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > dist/release-notes.md
          python tools/publish_metadata.py modrinth \
            --version "$VERSION" \
            --project-id "$MODRINTH_PROJECT_ID" \
            --changelog dist/release-notes.md \
            > dist/modrinth.json
          python tools/publish_metadata.py curseforge \
            --version "$VERSION" \
            --changelog dist/release-notes.md \
            > dist/curseforge.json

      - name: Publish to Modrinth
        shell: bash
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: $GITHUB_REPOSITORY ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
            --form "data=<dist/modrinth.json;type=application/json" \
            --form "catkins=@$ARCHIVE;type=application/zip" \
            https://api.modrinth.com/v2/version

      - name: Publish to CurseForge
        shell: bash
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form "metadata=<dist/curseforge.json;type=application/json" \
            --form "file=@$ARCHIVE;type=application/zip" \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file"

      - name: Create GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE"
          --verify-tag
          --title "Catkins $VERSION"
          --notes-file dist/release-notes.md
