name: Build release archives
description: Build every Catkins archive for a release tag and write that version's CHANGELOG.md section to dist/release-notes.md.

inputs:
  tag:
    description: Release tag, such as v1.0.0
    required: true

outputs:
  version:
    description: Pack version, the tag without its leading v
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check the tag
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version="${TAG#v}"
        if [[ "$TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tags must look like v1.0.0, got $TAG" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip

    - name: Install build dependency
      shell: bash
      run: python -m pip install --requirement requirements.txt

    - name: Build archives
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: python tools/build.py --version "$VERSION"

    - name: Write release notes from CHANGELOG.md
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python tools/changelog_section.py --version "$VERSION" > dist/release-notes.md
        echo "Release notes for $VERSION:"
        cat dist/release-notes.md
