name: Build release archives
description: Build every Catkins archive for a release tag, write that version's CHANGELOG.md section to dist/release-notes.md, and select the archives to publish.

inputs:
  tag:
    description: Release tag, such as v1.0.0
    required: true
  targets:
    description: Space-separated archive labels to select, such as "1.21.4 26.3". Empty selects every archive.
    required: false
    default: ""

outputs:
  targets:
    description: JSON array of selected archives, one object per archive with label, file, name, platform_version, and newline-separated game_versions
    value: ${{ steps.select.outputs.targets }}

runs:
  using: composite
  steps:
    - name: Check the tag
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version="${TAG#v}"
        if [[ "$TAG" != v* || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "Release tags must look like v1.0.0, got $TAG" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip

    - name: Install build dependency
      shell: bash
      run: python -m pip install --requirement requirements.txt

    - name: Run tests
      shell: bash
      run: python -m unittest discover --start-directory tests

    - name: Build archives
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: python tools/build.py --version "$VERSION"

    - name: Check that the build reproduces the committed assets
      shell: bash
      run: |
        if ! git diff --exit-code --stat -- java; then
          echo "The build changed files under java/. Run tools/build.py locally and commit the result." >&2
          exit 1
        fi

    - name: Write release notes from CHANGELOG.md
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python tools/changelog_section.py --version "$VERSION" > dist/release-notes.md
        echo "Release notes for $VERSION:"
        cat dist/release-notes.md

    - name: Select archives
      id: select
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        unknown="$(jq -r --arg filter "$TARGETS" '
          [$filter | split(" ")[] | select(. != "")] - [.targets[].label] | .[]' dist/manifest.json)"
        if [[ -n "$unknown" ]]; then
          echo "Unknown archive labels: $unknown" >&2
          echo "Valid labels:" >&2
          jq -r '.targets[].label' dist/manifest.json >&2
          exit 1
        fi
        targets="$(jq -c --arg filter "$TARGETS" '
          [ .targets[]
            | select($filter == "" or (.label | IN($filter | split(" ")[])))
            | { label, file, name, platform_version,
                game_versions: (.game_versions | join("\n")) } ]' dist/manifest.json)"
        echo "targets=$targets" >> "$GITHUB_OUTPUT"
        echo "$targets" | jq -r '.[] | "Selected \(.file) for \(.game_versions | gsub("\n"; ", "))"'
